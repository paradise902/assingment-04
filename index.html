<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <!-- Fonts  -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"> 

     <!-- Tailwind CSS -->
      <script src="https://cdn.tailwindcss.com"></script>

      <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />

    <!-- Custom Theme Tailwind Css -->
        <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],
            sans:    ['"Plus Jakarta Sans"',  'system-ui', 'sans-serif'],
          },
          keyframes: {
            bump: {
              '0%, 100%': { transform: 'scale(1)' },
              '40%':      { transform: 'scale(1.10)' },
            },
            'card-in': {
              from: { opacity: '0', transform: 'translateY(8px)' },
              to:   { opacity: '1', transform: 'translateY(0)' },
            },
            'card-out': {
              to: { opacity: '0', transform: 'translateY(-4px) scale(0.98)' },
            },
          },
          animation: {
            bump:       'bump 360ms cubic-bezier(0.22, 1, 0.36, 1)',
            'card-in':  'card-in 280ms cubic-bezier(0.22, 1, 0.36, 1) both',
            'card-out': 'card-out 240ms ease-in forwards',
          },
        },
      },
    }
  </script>

</head>
<body class="font-sans bg-[#F7F7F72] text-slate-900 min-h-screen">

    <!-- Tailwind Classes are generated from JS -->
      <div class="hidden animate-bump animate-card-out" aria-hidden="true"></div>

    <!-- Decorative gradient blobs -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-32 -left-20 w-[480px] h-[480px] rounded-full bg-blue-500/10 blur-3xl"></div>
    <div class="absolute -top-40 right-0 w-[420px] h-[420px] rounded-full bg-emerald-500/10 blur-3xl"></div>
    </div>
 
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-8 sm:py-10">

  <!-- ============ TOP BAR ============ -->
    <header class="flex items-center justify-between mb-8 sm:mb-10">
      <a href="#" class="flex items-center gap-2.5">
        <span class="grid place-items-center w-9 h-9 rounded-xl bg-slate-900 text-white shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
        </span>
        <span class="font-display font-semibold tracking-tight text-lg">JobTrail</span>
      </a>
      <a href="#" class="hidden sm:inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">
        Documentation
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </a>
    </header>
   
</body>
</html>
